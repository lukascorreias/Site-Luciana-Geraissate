<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f0">
  <meta name="robots" content="noindex,nofollow">
  <title>Clínica Luciana Geraissate</title>
  <meta name="description" content="Clínica Luciana Geraissate — Fisioterapia e Pilates.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <div class="page-frame">
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="Luciana Geraissate, início">
        <img src="assets/logo-marrom.png" alt="Luciana Geraissate — Fisioterapia e Pilates" width="1974" height="797">
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span>
        <span class="sr-only">Abrir menu</span>
      </button>

      <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
        <a href="#clinica">A clínica</a>
        <a href="#tratamentos">Tratamentos</a>
        <a href="#metodo">Como cuidamos</a>
        <a href="#contato">Contato</a>
      </nav>

      <div class="top-actions">
        <a class="appointment-shortcut" href="#contato" aria-label="Agendar pelo WhatsApp">
          <span>Agendar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.7a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5l1.4-4.4a8.4 8.4 0 1 1 15.6-4.4Z"/><path d="M8.1 7.6c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.8 1.8c.1.3 0 .5-.2.7l-.7.8c-.2.2-.1.5 0 .7.7 1.2 1.7 2.1 2.9 2.7.3.2.5.1.7-.1l.9-1.1c.2-.2.4-.3.7-.2l1.8.9c.3.1.4.3.4.5 0 .3-.2 1.5-1.1 2.1-.6.4-1.3.7-2.2.5-1.2-.2-2.7-.8-4.4-2.3-1.3-1.2-2.3-2.6-2.7-3.8-.5-1.4 0-2.5.4-3.2Z"/></svg>
        </a>
      </div>
    </header>

    <main id="conteudo">
      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Fisioterapia e Pilates</p>
          <h1 id="hero-title">Cuidado que<br>devolve<br><em>movimento.</em></h1>
          <a class="outline-button" href="#contato">Conheça a clínica</a>
        </div>

        <div class="portrait-stage" aria-hidden="true">
          <span class="portrait-halo"></span>
          <img src="assets/luciana-cutout-brown-pants.png" alt="" width="1024" height="1536">
        </div>

        <aside class="feature-card" aria-label="Destaque da clínica">
          <img class="feature-photo" src="assets/card-pilates.webp" alt="Luciana acompanhando uma paciente no Pilates" width="1500" height="1000">
          <div class="feature-copy">
            <span>Conheça</span>
            <p>Um cuidado atento a cada fase do seu movimento.</p>
            <a href="#metodo" aria-label="Conheça nossa forma de cuidar">↗</a>
          </div>
          <div class="feature-seal">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7c-8 7-12 13-12 20a12 12 0 0 0 24 0c0-7-4-13-12-20Zm0 8v22m-7-10 7 10 7-10"/></svg>
            <span>Cuidado individual</span>
          </div>
        </aside>

        <div class="care-switch" data-active="0" aria-label="Modalidades de atendimento">
          <span class="care-switch__slider" aria-hidden="true"></span>
          <span class="care-switch__shine" aria-hidden="true"></span>
          <button class="active" type="button" aria-pressed="true">Individual</button>
          <button type="button" aria-pressed="false">Pilates</button>
        </div>

        <div class="hero-signature">
          <span>Fisioterapia</span>
          <small>Presença em cada etapa</small>
        </div>

        <a class="expand-link" href="#clinica" aria-label="Explorar a página">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
        </a>
      </section>

      <section class="next-section" id="clinica" aria-label="Continuação do site">
        <p>Próxima seção</p>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
